services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desperdicio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: desperdicio_zero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desperdicio -d desperdicio_zero"]
      interval: 5s
      timeout: 3s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_DEBUG: "true"
      APP_DATABASE_URL: postgresql+asyncpg://desperdicio:${DB_PASSWORD:-devpassword}@postgres:5432/desperdicio_zero
      APP_JWT_PRIVATE_KEY_PATH: /tmp/private_key.pem
      APP_JWT_PUBLIC_KEY_PATH: /tmp/public_key.pem
      APP_RATE_LIMIT_LOGIN_PER_MINUTE: "30"
      APP_RATE_LIMIT_GUEST_PER_MINUTE: "600"
      APP_RATE_LIMIT_DEFAULT_PER_MINUTE: "3000"
      APP_CORS_ORIGINS: '["http://localhost:3000"]'
      APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_GOOGLE_REDIRECT_URI: http://localhost:8000/api/auth/google/callback
      APP_FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      NEXT_PUBLIC_CLARITY_ID: ${NEXT_PUBLIC_CLARITY_ID:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
